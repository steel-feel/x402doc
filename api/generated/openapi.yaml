openapi: 3.0.0
info:
  title: X402Docs Services
  version: 0.0.0
tags:
  - name: X402Docs
  - name: Health
paths:
  /api/v1:
    get:
      operationId: X402DocsHttp_list
      description: List documents
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
      tags:
        - X402Docs
  /api/v1/documents:
    post:
      operationId: X402DocsHttp_create
      description: Create document
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      tags:
        - X402Docs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      security:
        - BearerAuth: []
  /api/v1/login:
    post:
      operationId: X402DocsHttp_login
      description: Login with username and password to get a JWT token
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
        - X402Docs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/price/eth:
    get:
      operationId: X402DocsHttp_getEthereumPrice
      description: Fetch the current Ethereum price
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumPriceResponse'
      tags:
        - X402Docs
  /api/v1/{id}:
    get:
      operationId: X402DocsHttp_read
      description: Read document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      tags:
        - X402Docs
  /grpc/document/get:
    post:
      operationId: DocumentService_getDocument
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
  /grpc/document/list:
    post:
      operationId: DocumentService_listDocuments
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocumentsResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                req:
                  $ref: '#/components/schemas/ListDocumentsReq'
              required:
                - req
  /health:
    get:
      operationId: HealthHttp_check
      description: Check health status
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      tags:
        - Health
components:
  schemas:
    CreateDocumentRequest:
      type: object
      required:
        - title
        - price
        - content
      properties:
        title:
          type: string
        price:
          type: integer
          format: int32
        content:
          type: string
    Document:
      type: object
      required:
        - id
        - title
        - price
        - content
      properties:
        id:
          type: string
        title:
          type: string
        price:
          type: integer
          format: int32
        content:
          type: string
    DocumentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    DocumentResponse:
      type: object
      required:
        - id
        - title
        - content
        - priceUsd
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        priceUsd:
          type: integer
          format: int32
    EthereumPriceResponse:
      type: object
      required:
        - price
      properties:
        price:
          type: number
          format: double
    HealthStatus:
      type: object
      required:
        - status
        - db_status
        - uptime
      properties:
        status:
          type: string
        db_status:
          type: string
        uptime:
          type: string
    ListDocumentsReq:
      type: object
    ListDocumentsResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentResponse'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    ProtoDocument:
      type: object
      required:
        - id
        - title
        - price
      properties:
        id:
          type: string
        title:
          type: string
        price:
          type: integer
          format: int32
      description: The template for omitting properties.
    ProtoDocumentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProtoDocument'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
